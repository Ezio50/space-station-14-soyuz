    - prototype: SMESBasic
      position: 0,1
    - prototype: SubstationBasic
      position: 2,1
      mediumVoltageConnection: true
    - prototype: SMESBasic
      position: 1,1
    - prototype: CableTerminal
      position: 0,0
      rotation: 180
      highVoltageConnection: true
    - prototype: CableTerminal
      position: 1,0
      rotation: 180
      highVoltageConnection: true
