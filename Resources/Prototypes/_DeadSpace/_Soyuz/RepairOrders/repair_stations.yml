    tile: FloorSteelCheckerDark
    prototypes: [ComputerPowerMonitoring, ComputerAtmosMonitoring]
    seat: ChairOfficeDark
    minCount: 2
    maxCount: 2
    spacing: 2
    unique: true
  - area: Left
    continuous: true
    prototypes: [TableReinforced]
    props: [Wrench, Screwdriver, CableApcStack]
    seat: Chair
    minCount: 2
    maxCount: 4
    spacing: 1
  - area: Right
    prototypes: [ClosetToolFilled, LockerElectricalSuppliesFilled, Rack]
    minCount: 2
    maxCount: 4
    spacing: 1
    unique: true
  decoration: [PottedPlant0, PottedPlant2]

